<!doctype html><html><head><meta charset="utf-8"><title>XZoom store artwork</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/content.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#f2f7fc;color:#102a43}#poster{height:800px;width:1280px;padding:52px 54px;display:grid;grid-template-columns:420px 1fr;gap:34px;align-items:center}header{display:flex;gap:13px;align-items:center;margin-bottom:32px}header img{border-radius:12px}header strong{font-size:25px;letter-spacing:-.5px}h1{font-size:48px;letter-spacing:-1.6px;line-height:1.13;margin:0 0 22px;font-weight:700;overflow-wrap:break-word}h2{font-size:22px;line-height:1.5;font-weight:400;margin:0;color:#4b6477;max-width:390px}ul{list-style:none;margin:32px 0;padding:0}li{display:flex;align-items:center;gap:12px;font-size:18px;margin-top:15px}li::before{content:'✓';color:#0968ad;font-size:20px;font-weight:700}footer{font-size:13px;color:#5e7485;margin-top:35px}.viewer-wrap{min-width:0;position:relative}.viewer-head{display:flex;align-items:center;justify-content:space-between;background:#172632;color:#c7d5df;padding:13px 17px;border-radius:17px 17px 0 0;font-size:12px}.dots{display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:#728591}.viewer{height:548px;background:#080d12;position:relative;overflow:hidden;border-radius:0 0 17px 17px;box-shadow:0 20px 50px #102a4320}#frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}#holder{height:100%;display:flex;align-items:center;justify-content:center}#native{max-width:100%;max-height:100%;object-fit:contain}#native-close{position:absolute;left:12px;top:12px;background:#ffffff18;color:white;border:0;width:28px;height:28px;border-radius:50%;font-size:19px;z-index:4}.demo{display:block;color:#61778a;font-size:11px;margin-top:16px;line-height:1.5}.tile-only{display:none}body[data-type=tile]{background:#071e3d;color:white}body[data-type=tile] #poster{display:none}body[data-type=tile] .tile-only{width:440px;height:280px;display:flex;align-items:center;justify-content:center;gap:22px;padding:28px}.tile-only img{width:98px;height:98px;border-radius:22px}.tile-only strong{display:block;font-size:35px;letter-spacing:-1px}.tile-only span{display:block;margin-top:8px;font-size:16px;line-height:1.5;color:#c0e4fb;max-width:210px}
</style></head><body><main id="poster"><section><header><img src="/dist/icons/128.png" alt="" width="48" height="48"><strong>XZoom</strong></header><h1 id="headline"></h1><h2 id="subhead"></h2><ul id="points"></ul><footer>GoodExts · <span id="privacy"></span></footer></section><section class="viewer-wrap"><div class="viewer-head"><span class="dots"><i></i><i></i><i></i></span><span>XZoom · X / Twitter</span><span>↗</span></div><div class="viewer" role="dialog" aria-modal="true"><div data-testid="swipe-to-dismiss" id="frame"><div id="holder"><img id="native" alt="Example field notes graphic" src="/tools/store-listing/demo.png"></div></div><button id="native-close" aria-label="Close preview">×</button></div><small class="demo" id="demo"></small></section></main><div class="tile-only"><img src="/dist/icons/128.png" alt=""><div><strong>XZoom</strong><span id="tile-text"></span></div></div><script type="module">
const params=new URLSearchParams(location.search),lang=params.get('lang')||'en',view=params.get('view')||'overview';document.body.dataset.type=params.get('type')||'screenshot';
const listing=await(await fetch('/tools/store-listing/listing.json')).json(),copy=listing.locales[lang],messages=await(await fetch('/src/_locales/'+lang+'/messages.json')).json();
document.documentElement.lang=lang.replace('_','-');document.querySelector('#headline').textContent=view==='pixels'?copy.secondHeadline:copy.headline;document.querySelector('#subhead').textContent=copy.subhead;for(const text of copy.points){const li=document.createElement('li');li.textContent=text;document.querySelector('#points').append(li);}document.querySelector('#demo').textContent=copy.demo;
document.querySelector('#privacy').textContent=({en:'Open source · No tracking',zh_CN:'开源 · 无追踪',pt_BR:'Código aberto · Sem rastreamento',es:'Código abierto · Sin rastreo'})[lang];document.querySelector('#tile-text').textContent=copy.subhead;
if(document.body.dataset.type!=='tile'){
const image=document.querySelector('#native');await image.decode();const fake='https://pbs.twimg.com/media/XZOOM_DEMO?format=png&name=large';Object.defineProperty(image,'src',{get:()=>fake});Object.defineProperty(image,'currentSrc',{get:()=>fake});history.replaceState({},'','/demo/status/123/photo/1');
globalThis.chrome={runtime:{id:'xzoom-store-demo'},i18n:{getMessage:id=>messages[id]?.message||''}};const baseFetch=fetch;globalThis.fetch=(url,options)=>String(url).startsWith('https://pbs.twimg.com/media/XZOOM_DEMO')?baseFetch('/tools/store-listing/demo.png',options):baseFetch(url,options);
await import('/dist/vendor/panzoom.min.js');await import('/src/content.js');for(let i=0;i<100;i++){if(document.querySelector('[data-xzoom-action="download"]')?.disabled===false)break;await new Promise(r=>setTimeout(r,30));}if(document.querySelector('[data-xzoom-action="download"]')?.disabled!==false)throw Error('Real XZoom UI did not load');if(view==='pixels')document.querySelector('[data-xzoom-action="actual"]').click();await new Promise(r=>setTimeout(r,120));
}
await document.fonts.ready;document.body.dataset.ready='1';
</script></body></html>
